<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#050810;--card:#0b1120;--line:#1a2338;--text:#f3f6fc;--dim:#b5bfd0;--faint:#6b7a90;--accent:#5da9ff;--cyan:#00e5ff;--mag:#ff2dcd;--green:#4ade80}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--text)}
#cap{width:1200px;padding:44px 48px 40px;background:radial-gradient(600px 300px at 90% 0%,rgba(93,169,255,.12),transparent 70%),var(--bg)}
.k{font:700 14px "JetBrains Mono";letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h2{font:700 38px/1.1 "Space Grotesk";letter-spacing:-.02em;margin:10px 0 28px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 40px;position:relative}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;position:relative;min-height:168px}
.st:not(:nth-child(3n))::after{content:"→";position:absolute;right:-31px;top:50%;transform:translateY(-50%);font:700 22px "JetBrains Mono";color:var(--accent)}
.n{font:700 13px "JetBrains Mono";color:var(--faint);letter-spacing:.1em}
.big{font:700 40px/1 "Space Grotesk";margin:10px 0 8px;color:var(--text)}
.big small{font:500 18px "DM Sans";color:var(--dim);margin-left:6px}
.d{font-size:16px;line-height:1.45;color:var(--dim)}
.st.win{border-color:#1d4a30;background:#0b1d14}.st.win .big{color:var(--green)}
.st.lock{border-color:#16455a}.st.lock .big{color:var(--cyan)}
.bar{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.b{border:1px dashed #263450;border-radius:14px;padding:14px 18px;font-size:15.5px;line-height:1.4;color:var(--dim)}
.b b{display:block;font:700 13px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
</style></head><body><div id="cap">
<div class="k" id="k"></div><h2 id="h"></h2>
<div class="flow" id="flow"></div>
<div class="bar" id="bar"></div>
</div>
<script>
const lang=new URLSearchParams(location.search).get("lang")||"en";
const T={en:{k:"How we tested",h:"A blind test built so we couldn't fool ourselves",
 s:[["30","briefs","Plain requests in 15 genres a Chilean small business writes: client email, WhatsApp, IG caption, job post…"],
    ["60","AI texts","Each brief written once by GPT and once by Claude. Plus 8 texts people wrote before ChatGPT."],
    ["2","sets","Dev: where we tuned. Locked: generated by script, unread, opened once at the end.","lock"],
    ["6","versions per text","Ours and four other humanizers, each run as it ships, in its own isolated session."],
    ["3×2","judges","Three personas (editor, business owner, copy editor), each as a Claude and a GPT judge. Labels shuffled per text."],
    ["#1","of 6","With both judge families. 0 invented facts in 180 verdicts.","win"]],
 b:[["Automated","113 checker tests and a leak scan run on every pull request (CI)."],["Manual","Diego tested it on his own real texts, outside the test sets."],["Rounds","9 test rounds. The first 3 were retired: we had written those texts."]]},
 es:{k:"Cómo lo probamos",h:"Una prueba a ciegas hecha para no engañarnos",
 s:[["30","encargos","Pedidos simples en 15 géneros que escribe una pyme chilena: correo a cliente, WhatsApp, caption, aviso de trabajo…"],
    ["60","textos de IA","Cada encargo escrito una vez por GPT y otra por Claude. Más 8 textos que escribieron personas antes de ChatGPT."],
    ["2","sets","Desarrollo: donde ajustamos. Bloqueado: generado por script, sin leer, abierto una sola vez al final.","lock"],
    ["6","versiones por texto","La nuestra y otros cuatro humanizadores, cada uno tal como se publica, en su propia sesión aislada."],
    ["3×2","jueces","Tres perfiles (editora, dueño de pyme, corrector), cada uno como juez Claude y juez GPT. Etiquetas mezcladas por texto."],
    ["#1","de 6","Con las dos familias de jueces. 0 datos inventados en 180 evaluaciones.","win"]],
 b:[["Automático","113 pruebas del revisor y un escaneo de secretos en cada pull request (CI)."],["Manual","Diego la probó con sus propios textos, fuera de los sets de prueba."],["Rondas","9 rondas de prueba. Botamos las 3 primeras: esos textos los habíamos escrito nosotros."]]}}[lang];
k.textContent=T.k; h.textContent=T.h;
flow.innerHTML=T.s.map(([a,u,d,c],i)=>`<div class="st ${c||""}"><div class="n">0${i+1}</div><div class="big">${a}<small>${u}</small></div><div class="d">${d}</div></div>`).join("");
bar.innerHTML=T.b.map(([a,d])=>`<div class="b"><b>${a}</b>${d}</div>`).join("");
</script></body></html>
