<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>humanizer-es: how it works</title>
  <desc>A Spanish text goes in. The skill marks AI tells, strongest first. No tells means a person wrote it: fix clear typos and stop. Otherwise it drafts by deleting tells, never adding a fact, audits every claim against the original, and writes the final version. An optional second opinion from another model runs only with permission. Out comes the rewrite with a note on what changed. A separate regex checker scores texts out of 5, offline.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a90"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/></marker>
    <style>
      .card { fill: #0b1120; stroke: #1a2338; stroke-width: 1.5; }
      .step { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; fill: #00e5ff; }
      .h { font-size: 18px; font-weight: 700; fill: #f3f6fc; }
      .t { font-size: 13.5px; fill: #b5bfd0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #6b7a90; }
      .line { stroke: #6b7a90; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="590" rx="20" fill="#050810"/>
  <text x="48" y="62" font-size="32" font-weight="800" fill="#f3f6fc">humanizer-es</text>
  <text x="48" y="92" font-size="17" fill="#b5bfd0">Make AI-written Spanish sound like you, without changing what it says.</text>
  <rect class="card" x="48" y="130" width="200" height="200" rx="14"/>
  <rect x="48" y="130" width="200" height="4" rx="2" fill="#00e5ff"/>
  <text class="step" x="66" y="164">1 · INPUT</text>
  <text class="h" x="66" y="192">Your text</text>
  <text class="t" x="66" y="222">An email, a caption,</text>
  <text class="t" x="66" y="242">a job post, a reply</text>
  <text class="mono" x="66" y="310">/humanizer-es</text>
  <path class="line" d="M250 230.0 H270" marker-end="url(#a)"/>
  <rect class="card" x="274" y="130" width="200" height="200" rx="14"/>
  <rect x="274" y="130" width="200" height="4" rx="2" fill="#ff2dcd"/>
  <text class="step" x="292" y="164">2 · WHO WROTE IT</text>
  <text class="h" x="292" y="192">Marks the tells</text>
  <text class="t" x="292" y="222">Strongest first:</text>
  <text class="t" x="292" y="242">theatre, calques,</text>
  <text class="t" x="292" y="262">rhythm, inflation</text>
  <text class="mono" x="292" y="310">SKILL.md · A to F</text>
  <path class="line" d="M476 230.0 H496" marker-end="url(#a)"/>
  <rect class="card" x="500" y="130" width="200" height="200" rx="14"/>
  <rect x="500" y="130" width="200" height="4" rx="2" fill="#ff2dcd"/>
  <text class="step" x="518" y="164">3 · DRAFT</text>
  <text class="h" x="518" y="192">Cuts, never adds</text>
  <text class="t" x="518" y="222">Delete the tell. Gap?</text>
  <text class="t" x="518" y="242">Use a fact already</text>
  <text class="t" x="518" y="262">in the text.</text>
  <text class="mono" x="518" y="310">step 2</text>
  <path class="line" d="M702 230.0 H722" marker-end="url(#a)"/>
  <rect class="card" x="726" y="130" width="200" height="200" rx="14"/>
  <rect x="726" y="130" width="200" height="4" rx="2" fill="#00e5ff"/>
  <text class="step" x="744" y="164">4 · AUDIT</text>
  <text class="h" x="744" y="192">Checks every fact</text>
  <text class="t" x="744" y="222">Same scope, same</text>
  <text class="t" x="744" y="242">strength, same</text>
  <text class="t" x="744" y="262">promises.</text>
  <text class="mono" x="744" y="310">step 3</text>
  <path class="line" d="M928 230.0 H948" marker-end="url(#a)"/>
  <rect class="card" x="952" y="130" width="200" height="200" rx="14"/>
  <rect x="952" y="130" width="200" height="4" rx="2" fill="#4ade80"/>
  <text class="step" x="970" y="164">5 · OUT</text>
  <text class="h" x="970" y="192">Rewrite + note</text>
  <text class="t" x="970" y="222">The version on top,</text>
  <text class="t" x="970" y="242">what changed below.</text>
  <text class="mono" x="970" y="310">copy and send</text>
  <path d="M374.0 332 V382 H1052.0 V336" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <rect x="414.0" y="366" width="598.0" height="32" rx="16" fill="#050810" stroke="#4ade80" stroke-width="1.5"/>
  <text x="713.0" y="387" text-anchor="middle" font-size="14" font-weight="600" fill="#4ade80">No tells: a person wrote it. Fix clear typos and stop.</text>
  <rect x="48" y="425" width="350" height="130" rx="14" fill="#0b1120" stroke="#1a2338" stroke-width="1.5"/>
  <text class="step" x="68" y="455" style="fill:#00e5ff">CHECKER</text>
  <text class="h" x="68" y="481">deslop-es</text>
  <text class="t" x="68" y="507">Regex, offline, free. Scores a text out of 5.</text>
  <text class="t" x="68" y="527">137 fixture tests run in CI.</text>
  <text class="mono" x="378" y="455" text-anchor="end">tools/deslop_es.py</text>
  <rect x="425" y="425" width="350" height="130" rx="14" fill="#0b1120" stroke="#5da9ff" stroke-dasharray="6 5" stroke-width="1.5"/>
  <text class="step" x="445" y="455" style="fill:#5da9ff">OPTIONAL</text>
  <text class="h" x="445" y="481">Second opinion</text>
  <text class="t" x="445" y="507">Another model rereads the final version.</text>
  <text class="t" x="445" y="527">Asks before sending anything.</text>
  <text class="mono" x="755" y="455" text-anchor="end">step 5</text>
  <rect x="802" y="425" width="350" height="130" rx="14" fill="#0b1120" stroke="#1a2338" stroke-width="1.5"/>
  <text class="step" x="822" y="455" style="fill:#00e5ff">PROOF</text>
  <text class="h" x="822" y="481">Blind test</text>
  <text class="t" x="822" y="507">Ranked 1st of 6, judged by Claude and GPT.</text>
  <text class="t" x="822" y="527">0 invented facts in 180 verdicts.</text>
  <text class="mono" x="1132" y="455" text-anchor="end">evals/README.md</text>
</svg>
